[package]
name = "udm-rust"
version = "1.0.0"
edition = "2021"
authors = ["Ushcodex <ushcodex@github.com>"]
description = "High-Performance Multi-Stream Download Manager with Browser Auto-Interception, Smart URL Resolvers, and Throttle Bypass"
readme = "README.md"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
url = "2.5"
urlencoding = "2.1"
colored = "2.1"
dirs = "5.0"
which = "6.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
